name: Build Titan Engine APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NDK_VERSION: "25.2.9519653"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "33.0.0"
  SDK_COMPILE_VERSION: 33
  SDK_MIN_VERSION: 24
  SDK_TARGET_VERSION: 33

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-33
            build-tools;33.0.0
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Setup Project Structure
        run: |
          echo "📁 إنشاء هيكل المشروع..."
          
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/titan/engine
          mkdir -p gradle/wrapper
          
          # نقل الملفات
          if [ -f "main.cpp" ]; then
            cp main.cpp app/src/main/cpp/main.cpp
            echo "✅ تم نقل main.cpp"
          elif [ ! -f "app/src/main/cpp/main.cpp" ]; then
            echo "❌ خطأ: main.cpp غير موجود!"
            exit 1
          fi
          
          if [ -f "CMakeLists.txt" ]; then
            cp CMakeLists.txt app/src/main/cpp/CMakeLists.txt
            echo "✅ تم نقل CMakeLists.txt"
          elif [ ! -f "app/src/main/cpp/CMakeLists.txt" ]; then
            echo "❌ خطأ: CMakeLists.txt غير موجود!"
            exit 1
          fi
          
          if [ -f "build.gradle" ]; then
            cp build.gradle app/build.gradle
            echo "✅ تم نقل build.gradle"
          elif [ ! -f "app/build.gradle" ]; then
            echo "❌ خطأ: build.gradle غير موجود!"
            exit 1
          fi

      - name: Create AndroidManifest.xml
        run: |
          if [ ! -f "AndroidManifest.xml" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.titan.engine">

    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    
    <uses-feature android:glEsVersion="0x00030000" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen.multitouch" android:required="true" />
    
    <application
        android:allowBackup="true"
        android:label="Titan Engine"
        android:hardwareAccelerated="true">
        
        <activity
            android:name="android.app.NativeActivity"
            android:label="Titan Engine"
            android:configChanges="orientation|keyboardHidden|screenSize"
            android:screenOrientation="landscape"
            android:launchMode="singleInstance"
            android:exported="true">
            
            <meta-data
                android:name="android.app.lib_name"
                android:value="titan_engine" />
            
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
            echo "✅ تم إنشاء AndroidManifest.xml"
          else
            if [ -f "AndroidManifest.xml" ]; then
              cp AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
            echo "✅ AndroidManifest.xml موجود"
          fi

      - name: Create Resource Files
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">Titan Engine</string>
</resources>
EOF
          
          cat > app/src/main/res/values/styles.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="android:Theme.NoTitleBar.Fullscreen">
        <item name="android:windowFullscreen">true</item>
    </style>
</resources>
EOF
          
          echo "✅ تم إنشاء ملفات الموارد"

      - name: Create Gradle Configuration
        run: |
          # Root build.gradle
          cat > build.gradle << 'EOF'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
EOF
          
          # settings.gradle
          cat > settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "TitanEngine"
include ':app'
EOF
          
          # gradle-wrapper.properties
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          
          echo "✅ تم إنشاء إعدادات Gradle"

      - name: Setup Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmake/${{ env.CMAKE_VERSION }}/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          echo "🚀 بدء عملية بناء APK..."
          
          # تنظيف المشروع
          ./gradlew clean --no-daemon
          
          # بناء Debug APK
          ./gradlew app:assembleDebug --no-daemon --stacktrace
          
          echo "✅ تم بناء APK بنجاح!"

      - name: Verify APK
        run: |
          echo "📋 التحقق من ملفات APK..."
          
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" | wc -l)
          
          if [ $APK_COUNT -gt 0 ]; then
            echo "✅ تم العثور على ${APK_COUNT} ملف APK:"
            find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          else
            echo "❌ خطأ: لم يتم العثور على ملفات APK!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Titan-Engine-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 تم بناء Titan Engine APK بنجاح!"
          else
            echo "❌ فشل البناء! تحقق من السجلات للأخطاء"
          fi
