name: Build Titan Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Gradle Wrapper
        run: gradle wrapper # هذا الأمر سيقوم بإنشاء ملفات التشغيل المفقودة تلقائياً

      - name: Build Project Structure
        run: |
          mkdir -p app/src/main/cpp
          # إنشاء ملف CMakeLists بسيط إذا لم يكن موجوداً لمنع الخطأ
          if [ ! -f "CMakeLists.txt" ]; then
            echo "cmake_minimum_required(VERSION 3.10)" > app/src/main/cpp/CMakeLists.txt
          fi
          # إنشاء ملف AndroidManifest بسيط
          mkdir -p app/src/main
          echo '<manifest package="com.titan.engine" />' > app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Engine-V1
          path: |
            **/build/outputs/apk/debug/*.apk
            
